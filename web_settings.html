<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Radio Station · APRS / BBS</title><link rel="stylesheet" href="/assets/web_theme.css?v=29">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,sans-serif;background:#0b1120;color:#edf3fc}header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:18px 28px;border-bottom:1px solid #2d4058;background:#0f192b}.brand{font-weight:750;font-size:23px}.brand b{color:#64dfc5}.sub{color:#a5b6cc;font-size:12px}.statusbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.badge{padding:7px 11px;border:1px solid #34475e;border-radius:8px;font-size:12px}.good{color:#8febc3}.bad{color:#ffa9b6}main{max-width:1600px;margin:auto;padding:28px}h1{font-size:27px;margin:0 0 6px}p{color:#a5b6cc}.launcher{display:grid;grid-template-columns:1fr 1fr .8fr;gap:20px;margin:26px 0}.launch{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:14px;min-height:205px;padding:26px;border-radius:17px;border:1px solid #82404d;background:linear-gradient(130deg,#381d2a,#191d2d);color:#ffe7ed;cursor:pointer}.launch strong{font-size:34px;letter-spacing:-.03em}.launch span{font-size:13px;line-height:1.6;max-width:320px}.launch .state{font-size:11px;letter-spacing:.07em;border:1px solid #9b5260;border-radius:30px;padding:4px 11px}.launch.on{border-color:#3b9b79;background:linear-gradient(130deg,#123d32,#162c39);color:#d6ffed}.launch.on .state{border-color:#4eae8e;color:#92eec7}.launch.settings{border-color:#3c5477;background:linear-gradient(130deg,#233551,#192438);color:#dce9ff}.launch:hover{filter:brightness(1.13)}.workspace{border-top:1px solid #2d4058;padding-top:23px}.workspace[hidden]{display:none}iframe{display:block;width:100%;border:0;min-height:800px;background:#0b1120}.workspace-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.workspace-head h2{margin:0;font-size:22px}.notice{border:1px solid #84612e;background:#34291c;border-radius:10px;padding:12px 16px;color:#ffdaa6;white-space:pre-wrap}.notice:empty{display:none}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.panel{padding:22px;margin-bottom:16px;border:1px solid #2d4058;border-radius:14px;background:#131e30}label{display:block;font-size:12px;color:#a5b6cc;margin-bottom:6px}input,select{width:100%}button{cursor:pointer}#settings-result{white-space:pre-wrap}.mode-summary{display:flex;gap:24px;flex-wrap:wrap;color:#b8cbe0;padding:8px 0}footer{padding:16px 28px;font-size:11px;color:#a5b6cc;border-top:1px solid #2d4058}.check{display:flex;align-items:center;gap:9px}.check input{width:auto}@media(max-width:750px){header{padding:16px}.brand{font-size:20px}main{padding:18px 14px}.launcher{grid-template-columns:1fr;gap:12px;margin:20px 0}.launch{min-height:130px;padding:20px;gap:8px}.launch strong{font-size:28px}.launch.settings{min-height:110px}.statusbar{gap:6px}.badge{font-size:11px}h1{font-size:23px}.workspace{padding-top:18px}}
.launcher .launch:hover:not(:disabled){background:linear-gradient(130deg,#4a2535,#25243a)}.launcher .launch.on:hover:not(:disabled){background:linear-gradient(130deg,#1b5142,#1a3949)}.launcher .launch.settings:hover:not(:disabled){background:linear-gradient(130deg,#2e4669,#22324b)}</style></head><body><main><h1 data-cs="Nastavení stanice" data-en="Station settings">Nastavení stanice</h1>
<p data-cs="Společný CALL, SSID a TNC. Další nastavení APRS a BBS jsou v levém menu." data-en="Shared CALL, SSIDs and TNC. Use the sidebar for APRS and BBS settings.">Společný CALL, SSID a TNC. Další nastavení APRS a BBS jsou v levém menu.</p><form id="station-settings"><div class="panel"><div class="form-grid">
<div><label for="base-call">CALL / username</label><input id="base-call" maxlength="6" pattern="[A-Za-z0-9]{3,6}" required autocomplete="username" placeholder="OK5TVR"><p data-cs="Bez SSID. Stejná značka slouží k přihlášení a označuje web i displej Raspberry." data-en="Without SSID. This callsign is also your username and identifies the web and Raspberry display.">Bez SSID. Stejná značka slouží k přihlášení a označuje web i displej Raspberry.</p></div>
<div><label for="igate-ssid">iGate SSID</label><input id="igate-ssid" type="number" min="0" max="15" required><label for="digi-ssid">DIGI SSID</label><input id="digi-ssid" type="number" min="0" max="15" required></div>
<div><label for="bbs-ssid">BBS server SSID</label><input id="bbs-ssid" type="number" min="0" max="15" required><label for="client-ssid">BBS client SSID</label><input id="client-ssid" type="number" min="0" max="15" required></div>
<div><label for="ui-language-choice" data-cs="Jazyk webového rozhraní" data-en="Web interface language">Jazyk webového rozhraní</label><select id="ui-language-choice"><option value="cs">Čeština</option><option value="en">English</option></select><p data-cs="SSID 0 znamená značku bez přípony." data-en="SSID 0 means a callsign without a suffix.">SSID 0 znamená značku bez přípony.</p></div>
</div></div>
<div class="panel"><div class="form-grid"><div><label for="tnc-transport">TNC transport</label><select id="tnc-transport"><option value="serial">USB / serial KISS</option><option value="tcp">TCP KISS</option></select></div><div><label for="tnc-port" data-cs="USB port" data-en="USB port">USB port</label><input id="tnc-port" placeholder="auto"></div><div><label for="tnc-host">TCP host</label><input id="tnc-host"></div><div><label for="tnc-tcp-port">TCP port</label><input id="tnc-tcp-port" type="number" min="1" max="65535"></div></div></div>
<button id="settings-save" class="primary" data-cs="Uložit nastavení" data-en="Save settings">Uložit nastavení</button><p id="settings-result" role="status"></p></form></main>
<script src="/assets/web_locale.js"></script><script>
"use strict";
const $=id=>document.getElementById(id),key=new URLSearchParams(location.search).get('admin')||'';
const auth=path=>path+(key?(path.includes('?')?'&':'?')+'admin='+encodeURIComponent(key):'');
const tr=(cs,en)=>window.OK5TVRLocale.language==='en'?en:cs;
let loaded=false;
async function command(action,data={}){const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json','X-APRS-Admin':key,'X-APRS-CSRF':'1'},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'HTTP '+r.status);return j.result;}
async function loadSettings(){try{const response=await fetch(auth('/api/config'),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const c=await response.json();$('base-call').value=c.station.call;for(const role of ['igate','digi','bbs','client'])$(role+'-ssid').value=c.station[role+'_ssid'];$('tnc-port').value=c.serial.port;$('tnc-transport').value=c.tnc.transport;$('tnc-host').value=c.tnc.tcp_host;$('tnc-tcp-port').value=c.tnc.tcp_port;loaded=true;}catch(e){$('settings-result').textContent=e.message;}}
$('station-settings').addEventListener('submit',async event=>{
 event.preventDefault();if(!loaded)return;
 const station={call:$('base-call').value.trim().toUpperCase()};for(const role of ['igate','digi','bbs','client'])station[role+'_ssid']=Number($(role+'-ssid').value);
 if(!confirm(tr('Uložit nastavení? Aktivní funkce se zastaví. Při změně CALL se změní i přihlašovací jméno.','Save settings? Running functions will stop. Changing CALL also changes the username.')))return;
 $('settings-save').disabled=true;
 try{await command('station_save',{station,serial:{port:$('tnc-port').value.trim()},tnc:{transport:$('tnc-transport').value,tcp_host:$('tnc-host').value.trim(),tcp_port:Number($('tnc-tcp-port').value)}});$('settings-result').textContent=tr('Nastavení uloženo.','Settings saved.');window.dispatchEvent(new Event('station:refresh'));}catch(e){$('settings-result').textContent=e.message;}finally{$('settings-save').disabled=false;}
});
loadSettings();
</script></body></html>
